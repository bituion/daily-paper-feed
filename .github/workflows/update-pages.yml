name: Update papers and Pages

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 01:20 运行（北京时间 09:20）
    - cron: '20 1 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python daily_fetch.py

      - name: Build GitHub Pages (docs/)
        run: |
          python build_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            git add papers_data.json docs/index.html docs/papers_data.json
            git commit -m "chore: update papers & pages" \
              -m "Automated update from GitHub Actions."
            git push
          else
            echo "No changes to commit."
          fi
